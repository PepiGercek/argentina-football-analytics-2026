[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lpf-analytics"
version = "0.1.0"
description = "LPF 2026: resultados y balances de equipos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1,<4",
    "lxml>=6.1.3,<7",
    "numpy>=1.24.1,<3",
    "scikit-learn>=1.9.1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
